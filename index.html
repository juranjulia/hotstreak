<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>吉祥物大狂奔</title>
<style>
:root{
  --bg:#fbf6ec; --panel:#ffffff; --ink:#2a2420; --muted:#867b70; --line:#eadfcd; --soft:#f5ede0;
  --c0:#e0483b; --c1:#e3a51f; --c2:#3b78d6; --c3:#2f9e52; --all:#7c5cd6;
  --gold:#f2b632; --ok:#2f9e52; --bad:#d9443a;
  --lane:#e9f4e4; --lane2:#e1efdb; --buffer:#fde9a8; --fold:#cfc6b8;
  --mono:"SFMono-Regular",Menlo,Consolas,monospace;
  --display:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--display);min-height:100vh}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:8px 14px;font-weight:700;background:#efe5d4;color:var(--ink);transition:filter .12s,transform .06s}
button:hover:not(:disabled){filter:brightness(.96)}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.45;cursor:default}
button.main{background:var(--ink);color:#fff}
button.gold{background:var(--gold);color:#3b2a05}
button.ghost{background:transparent;border:1.5px solid var(--line)}
input[type=text]{font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--ink);outline:none;width:100%}
input[type=text]:focus{border-color:var(--gold)}
h1,h2,h3{margin:0}
[hidden]{display:none!important}
.muted{color:var(--muted)} .small{font-size:12px}
.row{display:flex;gap:8px;align-items:center} .sp{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 2px 0 #efe4d1}
.card>h3{font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.err{color:var(--bad);min-height:20px;margin-top:8px;font-size:13px}
.m0{--c:var(--c0)} .m1{--c:var(--c1)} .m2{--c:var(--c2)} .m3{--c:var(--c3)} .mall{--c:var(--all)}

/* 首页 / 大厅 */
.home{max-width:460px;margin:7vh auto;padding:0 16px}
.logo{text-align:center;font-size:44px;font-weight:900;letter-spacing:.08em;line-height:1.15}
.logo span{display:inline-block;transform:rotate(-3deg);color:var(--c0)}
.emojis{text-align:center;font-size:34px;margin:6px 0 2px;letter-spacing:.2em}
.tag{text-align:center;color:var(--muted);margin:0 0 22px}
.plist{display:flex;flex-direction:column;gap:6px;margin:12px 0 16px}
.plist div{display:flex;gap:8px;align-items:center;background:var(--soft);border-radius:8px;padding:7px 10px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none} .dot.off{background:#c9bfb1}
.badge{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--muted);font-weight:700}
.badge.gold{background:var(--gold);color:#3b2a05}

/* 游戏布局 */
.app{display:grid;grid-template-columns:1fr 320px;gap:14px;padding:14px;max-width:1500px;margin:0 auto}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top h2{font-size:22px;font-weight:900;letter-spacing:.05em}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:12px;color:var(--muted)}
.chip b{color:var(--ink)}

/* 赛道 */
.trackwrap{overflow-x:auto}
.track{position:relative;min-width:720px;user-select:none}
.lanes{position:relative;display:grid;grid-template-rows:repeat(4,var(--cell));--cell:54px;border-radius:10px;overflow:hidden;border:2px solid #cfe2c6}
.lane{display:grid;grid-template-columns:repeat(var(--cols),1fr);background:var(--lane)}
.lane:nth-child(even){background:var(--lane2)}
.cell{position:relative;border-right:1px solid rgba(0,0,0,.05);display:grid;place-items:center}
.cell.buf{background:repeating-linear-gradient(135deg,var(--buffer) 0 8px,#fbe08a 8px 16px)}
.cell.start{box-shadow:inset -3px 0 0 #fff}
.cell.white{box-shadow:inset 3px 0 0 rgba(255,255,255,.95)}
.cell.stretch{background-color:#f9efd2}
.cell.fin{background:repeating-conic-gradient(#2a2420 0 25%,#fff 0 50%) 0 0/12px 12px;opacity:.9}
.cell.finstar{background:#fff7d6}
.cell .star{font-size:20px;color:var(--gold);opacity:.75}
.cell.folded::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(90,80,70,.55) 0 6px,rgba(90,80,70,.35) 6px 12px)}
.ruler{display:grid;grid-template-columns:repeat(var(--cols),1fr);font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;margin-top:4px}
.ruler span.w{color:var(--ink);font-weight:800}
.lanelabels{position:absolute;left:4px;top:0;display:grid;grid-template-rows:repeat(4,var(--cell));--cell:54px;z-index:1;pointer-events:none}
.lanelabels div{display:flex;align-items:center;font-size:11px;font-weight:800;color:rgba(0,0,0,.35)}
.tokens{position:absolute;inset:0}
.tok{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:#fff;border:3px solid var(--c);transform:scale(var(--s,1));
  display:grid;place-items:center;font-size:24px;box-shadow:0 3px 0 rgba(0,0,0,.18);transition:left .85s cubic-bezier(.3,.7,.3,1),top .85s cubic-bezier(.3,.7,.3,1),opacity .4s,transform .4s;z-index:2}
.tok .em{display:inline-block;transition:transform .4s}
.tok.back .em{transform:scaleX(-1)}
.tok .dir{position:absolute;right:-9px;top:50%;margin-top:-8px;width:16px;height:16px;border-radius:50%;background:var(--c);color:#fff;font-size:10px;font-weight:900;display:grid;place-items:center}
.tok.back .dir{right:auto;left:-9px}
.tok.fallen{transform:scale(var(--s,1)) rotate(90deg)}
.tok.fallen::after{content:"💫";position:absolute;top:-14px;font-size:14px;transform:rotate(-90deg)}
.tok.dq{opacity:.32;filter:grayscale(1)}
.tok.fin{box-shadow:0 0 0 4px var(--gold),0 3px 0 rgba(0,0,0,.18)}
.tok .medal{position:absolute;bottom:-10px;font-size:11px;font-weight:900;background:var(--gold);border-radius:999px;padding:0 6px;color:#3b2a05}
.tok.act{animation:pulse .9s}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--c)}70%{box-shadow:0 0 0 12px transparent}}
.noanim .tok{transition:none!important}

.under{display:grid;grid-template-columns:260px 1fr 300px;gap:12px;margin-top:12px}
.flip{border-radius:12px;background:var(--soft);min-height:118px;display:grid;place-items:center;text-align:center;padding:10px}
.flip .lbl{font-size:12px;color:var(--muted)}
.bigcard{display:inline-flex;flex-direction:column;align-items:center;gap:2px;padding:10px 16px;border-radius:12px;background:#fff;border:3px solid var(--c);min-width:150px;animation:flipin .45s}
.bigcard .e{font-size:26px} .bigcard .t{font-size:17px;font-weight:900}
@keyframes flipin{from{transform:rotateY(90deg) scale(.8);opacity:0}to{transform:none;opacity:1}}
.log{background:var(--soft);border-radius:12px;padding:8px 12px;height:118px;overflow:auto;font-size:13px}
.log p{margin:0 0 3px}
.log p:last-child{font-weight:700}
.podium{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pd{border-radius:10px;background:var(--soft);padding:6px;text-align:center;min-height:118px;display:flex;flex-direction:column;justify-content:flex-end}
.pd .n{font-weight:900;font-size:13px}
.pd .e{font-size:26px}
.pd.p1{background:#fff3c9} .pd.p2{background:#eef0f3} .pd.p3{background:#f6e3d4}
.pd .why{font-size:11px;color:var(--bad)}

/* 票 */
.board{display:grid;grid-template-columns:repeat(4,1fr) 1.4fr;gap:10px}
.stack{border-radius:12px;border:2px solid var(--c);padding:10px;background:#fff;display:flex;flex-direction:column;gap:6px}
.stack .hd{display:flex;align-items:center;gap:6px;font-weight:900}
.stack .hd .e{font-size:22px}
.stack .left{margin-left:auto;font-size:11px;color:var(--muted);font-weight:600}
.face{display:flex;flex-direction:column;align-items:stretch;gap:1px;text-align:left;padding:7px 9px;border-radius:9px;background:var(--soft);border:1.5px solid transparent;font-weight:600}
.face b{font-size:12px}
.face .pv{font-family:var(--mono);font-size:13px;font-weight:800}
.face.risky{background:#fff0ee}
button.face:not(:disabled):hover{border-color:var(--c)}
.sidecard{border-radius:12px;border:2px dashed var(--all);padding:10px;background:#f6f2ff}
.sidecard .q{font-weight:900;font-size:15px;margin:4px 0 8px}
.sidecard .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sidecard .two .stack{border-color:var(--all)}
.order{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0 0}
.order span{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted)}
.order span.done{text-decoration:line-through;opacity:.6}
.order span.now{background:var(--ink);color:#fff;font-weight:800}
.tk{display:inline-flex;align-items:center;gap:4px;border-radius:8px;padding:2px 7px;font-size:12px;font-weight:700;background:#fff;border:1.5px solid var(--c);margin:2px 4px 2px 0}
.tk .r{color:var(--bad)} .tk .x2{background:var(--gold);border-radius:4px;padding:0 4px;color:#3b2a05}

/* 手牌 */
.hand{display:flex;flex-wrap:wrap;gap:8px}
.hc{width:96px;min-height:92px;border-radius:10px;border:2.5px solid var(--c);background:#fff;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px;cursor:default}
.hc .e{font-size:22px} .hc .t{font-size:12.5px;font-weight:800;line-height:1.3}
.hc.pick{cursor:pointer}
.hc.pick:hover{transform:translateY(-2px)}
.hc.sel{box-shadow:0 0 0 3px var(--gold);transform:translateY(-3px)}
.hc.mini{width:auto;min-height:0;flex-direction:row;padding:3px 7px;gap:4px;border-width:1.5px}
.hc.mini .e{font-size:14px} .hc.mini .t{font-size:11.5px}
.pub{display:flex;flex-wrap:wrap;gap:4px}

/* 侧栏 */
.pl{display:flex;flex-direction:column;gap:6px}
.pr{border-radius:10px;padding:8px 10px;background:var(--soft)}
.pr.me{background:#fff6dc}
.pr .hd{display:flex;align-items:center;gap:6px}
.pr .money{margin-left:auto;font-family:var(--mono);font-weight:900;font-size:16px}
.st{font-size:11px;color:var(--muted)}

/* 结算 */
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px}
.pos{color:var(--ok);font-weight:900} .neg{color:var(--bad);font-weight:900}
.banner{text-align:center;font-size:26px;font-weight:900;margin:4px 0 12px}
.rank{display:flex;flex-direction:column;gap:6px}
.rank div{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:10px;padding:8px 12px;font-size:15px}
.rank .no{font-weight:900;width:28px}
.rank .m{margin-left:auto;font-family:var(--mono);font-weight:900;font-size:18px}

.mask{position:fixed;inset:0;background:rgba(40,30,20,.5);display:grid;place-items:center;z-index:20;padding:16px}
.modal{background:#fff;border-radius:16px;padding:20px;max-width:720px;width:100%;max-height:90vh;overflow:auto}
.modal h2{font-size:22px;margin-bottom:10px}
.modal p{margin:0 0 9px}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--bad);color:#fff;padding:8px 16px;border-radius:999px;z-index:30;font-size:14px;max-width:90vw}
.conn{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:6px 14px;border-radius:999px;font-size:13px;z-index:30}
.landscape{display:none}

@media (max-width:1150px){
  .app{grid-template-columns:1fr}
  .under{grid-template-columns:1fr 1fr}
  .under .log{grid-column:1/-1;order:3}
  .board{grid-template-columns:repeat(2,1fr)}
  .board .sidecard{grid-column:1/-1}
}
@media (max-width:700px) and (orientation:portrait){
  .landscape{display:block;background:#fff3c9;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:8px}
}
</style>
</head>
<body>

<!-- 首页 -->
<div class="home" id="home">
  <div class="emojis">🦁🐱🐶🐸</div>
  <div class="logo">吉祥物<span>大狂奔</span></div>
  <p class="tag">2–8 人 · 押注吉祥物赛跑 · 暗中动手脚</p>
  <div class="card">
    <label class="muted small">你的名字</label>
    <input type="text" id="name" maxlength="10" placeholder="比如：小明" autocomplete="off">
    <div style="height:12px"></div>
    <button class="main" id="createBtn" style="width:100%;padding:12px">创建房间</button>
    <p class="muted small" style="text-align:center;margin:12px 0">—— 或加入朋友的房间 ——</p>
    <div class="row">
      <input type="text" id="codeIn" maxlength="4" inputmode="numeric" placeholder="4 位房间号" autocomplete="off">
      <button id="joinBtn">加入</button>
    </div>
    <div class="err" id="homeErr"></div>
  </div>
  <p style="text-align:center;margin-top:14px"><button class="ghost" data-rules>查看规则</button></p>
</div>

<!-- 大厅 -->
<div class="home" id="lobby" hidden>
  <div class="card">
    <div class="row"><h2>房间 <span id="lCode" style="font-family:var(--mono);color:var(--c0);letter-spacing:.12em"></span></h2><span class="sp"></span>
      <button class="ghost" id="inviteBtn">复制邀请</button><button class="ghost" data-rules>规则</button><button class="ghost" id="leaveBtn">离开</button></div>
    <div class="plist" id="plist"></div>
    <button class="main" id="startBtn" style="width:100%;padding:12px"></button>
    <p class="muted small" style="margin:10px 0 0">2–8 人。每局 3 场比赛，每人起始 $10，最后钱最多的人获胜。</p>
  </div>
</div>

<!-- 游戏 -->
<div id="game" hidden>
  <div class="app">
    <div class="col">
      <div class="landscape">📱 把手机横过来看赛道会更清楚。</div>
      <div class="top">
        <h2>吉祥物大狂奔</h2>
        <span class="chip">房间 <b id="gCode"></b></span>
        <span class="chip" id="gRace"></span>
        <span class="chip" id="gPhase"></span>
        <span class="sp"></span>
        <button class="ghost" data-rules>规则</button>
        <button class="ghost" id="abortBtn" hidden>结束本局</button>
      </div>
      <div class="card">
        <div class="trackwrap"><div class="track" id="track"></div></div>
        <div class="under">
          <div class="flip" id="flip"><span class="muted">比赛开始后，在这里翻牌</span></div>
          <div class="log" id="log"><p class="muted">比赛记录</p></div>
          <div class="podium" id="podium"></div>
        </div>
      </div>
      <div class="card" id="stage"></div>
    </div>
    <div class="col">
      <div class="card"><h3>玩家</h3><div class="pl" id="players"></div></div>
      <div class="card"><h3>我的手牌 <span class="muted small" id="handNote"></span></h3><div class="hand" id="myHand"></div></div>
      <div class="card"><h3>牌堆里已公开的牌 <span class="muted small" id="pubNote"></span></h3><div class="pub" id="pub"></div>
        <p class="hint small muted" style="margin:8px 0 0">比赛牌堆 = 这些牌 + 每人暗中加入的牌，共 18 张。比赛开始时先弃掉 3 张不公开。</p></div>
    </div>
  </div>
</div>

<div class="mask" id="mask" hidden><div class="modal" id="modal"></div></div>
<div class="toast" id="toast" hidden></div>
<div class="conn" id="conn" hidden>连接中断，正在重连…</div>

<script>
(function(){
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const EMO = ['🦁','🐱','🐶','🐸'];
const MN = ['舞狮','招财猫','边牧','青蛙'];

let sess=null, S=null, es=null, offset=0, sel=[], player=null;

function toast(t){ const el=$('#toast'); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2800); }
async function api(path, body){
  const r = await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  let j={}; try{ j=await r.json(); }catch(e){}
  if(!r.ok) throw new Error(j.error||'网络出错，请重试');
  return j;
}
async function act(type, extra){
  try{ await api('/api/action', Object.assign({code:sess.code,id:sess.id,token:sess.token,type}, extra||{})); return true; }
  catch(e){ toast(e.message); return false; }
}

// ---------- 首页 ----------
$('#name').value = store.get('hs_name') || '';
const urlCode = new URLSearchParams(location.search).get('room');
if(urlCode){ $('#codeIn').value = urlCode;
  $('#homeErr').innerHTML = '<span class="muted">如果你是刷新后掉线的玩家，填写原来的名字再点「加入」，就能回到原来的座位。</span>'; }
function needName(){ const n=$('#name').value.trim(); if(!n){ $('#homeErr').textContent='先写个名字吧'; return null; } store.set('hs_name',n); return n; }
$('#createBtn').onclick = async()=>{ const n=needName(); if(!n) return; try{ enter(await api('/api/create',{name:n})); }catch(e){ $('#homeErr').textContent=e.message; } };
$('#joinBtn').onclick = async()=>{ const n=needName(); if(!n) return; const code=$('#codeIn').value.trim();
  if(!/^\d{4}$/.test(code)){ $('#homeErr').textContent='房间号是 4 位数字'; return; }
  const old=store.get('hs_s_'+code)||{};
  try{ enter(await api('/api/join',{code,name:n,id:old.id,token:old.token})); }catch(e){ $('#homeErr').textContent=e.message; } };
$('#codeIn').onkeydown = e=>{ if(e.key==='Enter') $('#joinBtn').click(); };

function enter(s){
  sess=s; store.set('hs_s_'+s.code,s); store.set('hs_last',s.code);
  history.replaceState(null,'','?room='+s.code);
  if(es) es.close();
  es = new EventSource(`/api/events?code=${s.code}&id=${s.id}&token=${s.token}`);
  es.onmessage = e=>{ $('#conn').hidden=true; S=JSON.parse(e.data); offset = S.now - Date.now(); render(); };
  es.onerror = ()=>{ if(es.readyState===EventSource.CLOSED){ store.del('hs_s_'+s.code); store.del('hs_last'); goHome('房间已失效，请重新创建'); } else $('#conn').hidden=false; };
}
function goHome(msg){ if(es) es.close(); es=null; sess=null; S=null; history.replaceState(null,'',location.pathname);
  $('#home').hidden=false; $('#lobby').hidden=true; $('#game').hidden=true; $('#conn').hidden=true; $('#homeErr').textContent=msg||''; }
(async()=>{ const code=urlCode||store.get('hs_last'); const old=code&&store.get('hs_s_'+code); if(!old) return;
  try{ enter(await api('/api/join',{code,id:old.id,token:old.token,name:store.get('hs_name')})); }catch(e){ store.del('hs_s_'+code); store.del('hs_last'); } })();

$('#leaveBtn').onclick = async()=>{ const s=sess; if(await act('leave')){ store.del('hs_s_'+s.code); store.del('hs_last'); goHome(); } };
$('#inviteBtn').onclick = async()=>{ const link=location.origin+location.pathname+'?room='+sess.code;
  const t=`来玩「吉祥物大狂奔」！打开链接：${link} （房间号 ${sess.code}）`;
  try{ await navigator.clipboard.writeText(t); toast('已复制，发给朋友吧'); }catch(e){ prompt('复制下面的内容发给朋友：',t); } };
$('#abortBtn').onclick = ()=>{ if(confirm('确定结束本局，回到大厅吗？')) act('lobby'); };

// ---------- 通用小部件 ----------
const P = id => S.players.find(p=>p.id===id) || {name:'?'};
const pn = id => esc(P(id).name);
const mcls = m => m==null ? 'mall' : 'm'+m;
const cardEmo = c => c.m==null ? '🌀' : EMO[c.m];
function cardLabel(c){
  const sg = n => n>0 ? '+'+n : String(n);
  switch(c.kind){
    case 'start': return `起跑：恢复后 ${sg(c.n)}`;
    case 'num': return sg(c.n);
    case 'star': return '★ 星星';
    case 'fall': return '摔倒';
    case 'turn': return '掉头';
    case 'swerve': return `${sg(c.n)} 后${c.dir==='L'?'向左':'向右'}转`;
    case 'recover': return `恢复后 ${sg(c.n)}`;
    case 'all-num': return `全体 ${sg(c.n)}`;
    case 'all-recover': return `全体恢复后 ${sg(c.n)}`;
  }
  return c.text;
}
const handCard = (c, extra) => `<div class="hc ${mcls(c.m)} ${extra||''}" data-card="${c.id}"><span class="e">${cardEmo(c)}</span><span class="t">${esc(c.m==null?'':MN[c.m])}<br>${esc(cardLabel(c))}</span></div>`;
const miniCard = c => `<div class="hc mini ${mcls(c.m)}"><span class="e">${cardEmo(c)}</span><span class="t">${esc(cardLabel(c))}</span></div>`;
const payTxt = (t) => t.type==='m' ? t.pay.map(v=>'$'+v).join('/') : `对 +$${t.pay[0]} / 错 ${t.pay[1]<0?'−$'+(-t.pay[1]):'$0'}`;
function ticketChip(t){
  const lab = t.type==='m' ? `${EMO[t.m]} ${MN[t.m]}` : `🎲 ${t.yes?'会':'不会'}`;
  return `<span class="tk ${t.type==='m'?'m'+t.m:'mall'}">${lab} · ${t.side==='risky'?'<span class="r">冒险</span>':'稳健'} <span class="muted">${payTxt(t)}</span>${t.dbl?'<span class="x2">×2</span>':''}</span>`;
}

// ---------- 渲染 ----------
function render(){
  $('#home').hidden=true;
  $('#lobby').hidden = S.phase!=='lobby';
  $('#game').hidden = S.phase==='lobby';
  if(S.phase==='lobby'){ player=null; return renderLobby(); }
  renderGame();
}

function renderLobby(){
  $('#lCode').textContent=S.code;
  $('#plist').innerHTML = S.players.map(p=>`<div><span class="dot ${p.online?'':'off'}"></span><b>${esc(p.name)}</b>${p.id===S.you?'<span class="muted small">（你）</span>':''}${p.id===S.host?'<span class="badge gold">房主</span>':''}</div>`).join('')
    + (S.players.length<8?'<div class="muted" style="background:transparent;border:1.5px dashed var(--line)">等待更多玩家加入…（2–8 人）</div>':'');
  const host=S.host===S.you, n=S.players.length, b=$('#startBtn');
  b.disabled = !host || n<2;
  b.textContent = !host ? '等待房主开始…' : n<2 ? '至少需要 2 人' : `开始游戏（${n} 人）`;

}

const PHASE = {bet:'选票', double:'选双倍', submit:'暗中出牌', race:'比赛中', payout:'结算', end:'游戏结束'};
function renderGame(){
  $('#gCode').textContent=S.code;
  $('#gRace').innerHTML = `第 <b>${S.race}</b> / ${S.races} 场`;
  $('#gPhase').innerHTML = `<b>${PHASE[S.phase]}</b>`;
  $('#abortBtn').hidden = S.host!==S.you || S.phase==='end';

  // 赛道：比赛 / 结算阶段由播放器控制，其他阶段显示起跑状态
  if(['race','payout','end'].includes(S.phase) && S.raceData){
    if(!player || player.startAt!==S.raceData.startAt) player = new RacePlayer(S.raceData, S.phase!=='race');
    else if(S.phase!=='race') player.finishNow();
  } else if(!player || player.startAt!=='idle'){ player = new RacePlayer(null); }

  // 玩家列表
  const ord = S.order||[], cur = S.phase==='bet' ? ord[S.pos] : null;
  $('#players').innerHTML = S.players.slice().sort((a,b)=>b.money-a.money).map(p=>{
    let st='';
    if(S.phase==='bet') st = p.id===cur ? '正在选票…' : '';
    if(S.phase==='double') st = p.doubled ? '已选好双倍 ✓' : '正在选双倍…';
    if(S.phase==='submit') st = p.submitted ? '已出牌 ✓' : '正在挑牌…';

      <div>${(S.tickets[p.id]||[]).map(ticketChip).join('') || '<span class="st">还没有票</span>'}</div>${st?`<div class="st">${st}</div>`:''}</div>`; }).join('');

  // 手牌与公开牌
  const pickable = S.phase==='submit' && !S.mySubmitted;
  sel = sel.filter(id=>S.hand.some(c=>c.id===id));
  $('#myHand').innerHTML = S.hand.map(c=>handCard(c, (pickable?'pick ':'')+(sel.includes(c.id)?'sel':''))).join('') || '<span class="muted small">没有手牌</span>';
  $('#handNote').textContent = S.mySubmitted ? `本场已加入：${S.mySubmitted.map(cardLabel).join('、')}` : '';
  if(pickable) document.querySelectorAll('#myHand [data-card]').forEach(el=>el.onclick=()=>{

    <div class="board">${[0,1,2,3].map(mStack).join('')}
      <div class="sidecard"><div class="small muted">🎲 附加赌注</div><div class="q">${esc(S.side.text)}</div>

function bindStage(){
  document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>act('pick',{stack:b.dataset.pick, side:b.dataset.side}));
  document.querySelectorAll('[data-dbl]').forEach(b=>b.onclick=()=>act('double',{index:Number(b.dataset.dbl)}));
  const on=(id,f)=>{ const el=$('#'+id); if(el) el.onclick=f; };
  on('subBtn', async()=>{ if(await act('submit',{cards:sel})) sel=[]; });
  on('nextBtn', ()=>act('next'));
  on('againBtn', ()=>act('lobby'));
  on('skipBtn', ()=>{ if(player) player.finishNow(); });
}

// ---------- 赛道与比赛播放器 ----------
function buildTrack(){
  const T=S.track, cols = T.last + 2 - T.back;           // 第 back 格到终点后一格
  const cls = r => {
    const c=[];
    if(r<0) c.push('buf');
    if(r===0) c.push('start');
    if(T.white.includes(r)) c.push('white');
    if(r>=T.white[T.white.length-1] && r<=T.last) c.push('stretch');
    if(r===T.last+1) c.push('finstar');
    return c.join(' ');
  };
  const rows=[]; for(let r=T.back;r<=T.last+1;r++) rows.push(r);
  $('#track').innerHTML = `<div class="lanes" id="lanes" style="--cols:${cols}">${[1,2,3,4].map(l=>`<div class="lane" style="--cols:${cols}">${rows.map(r=>
    `<div class="cell ${cls(r)}" data-r="${r}">${T.stars.includes(r)?'<span class="star">★</span>':''}</div>`).join('')}</div>`).join('')}
    <div class="tokens" id="tokens"></div></div>
    <div class="lanelabels">${[1,2,3,4].map(l=>`<div>${l}</div>`).join('')}</div>
    <div class="ruler" style="--cols:${cols}">${rows.map(r=>`<span class="${T.white.includes(r)?'w':''}">${r<0?'':r===0?'起点':r===T.last+1?'终点':r}</span>`).join('')}</div>`;
  // 终点线：画在第 last 格和终点格之间
  document.querySelectorAll('.cell[data-r="'+(T.last+1)+'"]').forEach(c=>c.style.boxShadow='inset 6px 0 0 #2a2420');
}

class RacePlayer {
  constructor(data, instant){
    this.data=data; this.startAt = data ? data.startAt : 'idle';
    this.ms = [0,1,2,3].map(i=>({lane:i+1,row:0,facing:1,fallen:false,status:'run',place:null,reason:null}));
    this.podium=[null,null,null,null]; this.boundary=S.track.back; this.idx=0; this.logs=[]; this.cur=null; this.act=null; this.seq=0; this.fkey=null;
    buildTrack();
    clearInterval(RacePlayer.timer);
    if(!data){ this.draw(true); $('#flip').innerHTML='<span class="muted">比赛开始后，在这里翻牌</span>'; $('#log').innerHTML='<p class="muted">比赛记录</p>'; return; }
    if(instant) this.finishNow(); else { this.tick(true); RacePlayer.timer = setInterval(()=>this.tick(false), 100); }
  }
  apply(item){
    const ms=this.ms;
    if(item.kind==='burn'){ this.cur={burn:item.n, k:++this.seq}; this.log(`弃掉 ${item.n} 张牌（不公开）`); return; }
    if(item.kind==='flip'){ this.cur={card:item.card, k:++this.seq}; this.log(`翻开：${item.card.text}`, true); return; }
    this.act = item.actor;
    for(const s of item.steps||[]){
      const x = s.m!=null ? ms[s.m] : null;
      switch(s.type){
        case 'move': x.row=s.to; x.lane=s.lane; break;
        case 'swerve': x.lane=s.to; break;
        case 'fall': case 'knocked': x.fallen=true; break;
        case 'turn': x.facing=s.facing; break;
        case 'recover': x.fallen=false; x.facing=1; break;
        case 'finish': x.status='fin'; x.place=s.place; this.podium[s.place-1]=s.m; break;
        case 'dq': s.ms.forEach((m,i)=>{ ms[m].status='dq'; ms[m].place=s.places[i]; ms[m].reason=s.reason; this.podium[s.places[i]-1]=m; }); break;
        case 'fold': this.boundary=s.line; break;
        case 'over': ms.forEach((x2,m)=>{ if(x2.status==='run'){ const p=this.podium.indexOf(null); this.podium[p]=m; x2.status='last'; x2.place=p+1; } }); break;
      }
    }
    if(item.kind==='fold') this.cur={fold:true, k:++this.seq};
    if(item.text) this.log(item.text);
  }
  log(t, strong){ this.logs.push(strong?`<b>${esc(t)}</b>`:esc(t)); }
  tick(first){
    const t = Date.now()+offset - this.startAt;
    const sch=this.data.schedule; let changed=false;
    while(this.idx<sch.length && sch[this.idx].at<=t){ this.apply(sch[this.idx++]); changed=true; }
    if(changed||first) this.draw(first && t>0);
    if(this.idx>=sch.length) clearInterval(RacePlayer.timer);
  }
  finishNow(){ clearInterval(RacePlayer.timer); const sch=this.data.schedule; while(this.idx<sch.length) this.apply(sch[this.idx++]); this.act=null; this.draw(true); }
  draw(noanim){
    const T=S.track, cols=T.last+2-T.back;
    // 格子折叠阴影
    document.querySelectorAll('.cell').forEach(c=>c.classList.toggle('folded', Number(c.dataset.r)<this.boundary));
    const box=$('#tokens'); if(!box) return;
    box.classList.toggle('noanim', !!noanim);
    if(!box.children.length) box.innerHTML = this.ms.map((x,m)=>`<div class="tok m${m}" id="tok${m}"><span class="em">${EMO[m]}</span><span class="dir">➜</span></div>`).join('');
    // 同一格多个吉祥物时错开
    const key = x => x.lane+':'+x.row, groups={};
    this.ms.forEach((x,m)=>{ (groups[key(x)]=groups[key(x)]||[]).push(m); });
    this.ms.forEach((x,m)=>{
      // 同一格有多个吉祥物：缩小并错开，避免叠在一起
      const el=$('#tok'+m), g=groups[key(x)], k=g.indexOf(m), d=k-(g.length-1)/2;
      const row = Math.min(x.row, T.last+1);
      el.style.setProperty('--s', g.length>1 ? .72 : 1);
      el.style.left = `calc(${(row - T.back + .5)/cols*100}% + ${d*18}px)`;
      el.style.top = `calc(${(x.lane-.5)/4*100}% + ${d*14}px)`;
      el.style.zIndex = 2 + k;
      el.classList.toggle('back', x.facing<0);
      el.classList.toggle('fallen', x.fallen && x.status==='run');
      el.classList.toggle('dq', x.status==='dq');
      el.classList.toggle('fin', x.status==='fin');
      el.classList.toggle('act', this.act===m);
      let md=el.querySelector('.medal'); if(md) md.remove();
      if(x.place) el.insertAdjacentHTML('beforeend', `<span class="medal">${x.status==='dq'?'✗':''}第${x.place}</span>`);
    });
    if(noanim) requestAnimationFrame(()=>box.classList.remove('noanim'));
    // 翻牌区
    const f=$('#flip');
    const fkey = this.cur ? 'k'+this.cur.k : (this.data ? 'wait' : 'idle');
    if(fkey===this.fkey){ /* 同一张牌，不重播翻牌动画 */ }
    else if((this.fkey=fkey) && this.cur && this.cur.card){ const c=this.cur.card; f.innerHTML=`<div><div class="lbl">刚翻开</div><div class="bigcard ${mcls(c.m)}"><span class="e">${cardEmo(c)}</span><span class="t">${esc(c.m==null?'':MN[c.m])} ${esc(cardLabel(c))}</span></div></div>`; }
    else if(this.cur && this.cur.burn) f.innerHTML=`<div><div class="lbl">倒数 3、2、1…</div><div style="font-size:30px">🂠🂠🂠</div><div class="small muted">弃掉 3 张</div></div>`;
    else if(this.cur && this.cur.fold) f.innerHTML=`<div><div style="font-size:30px">🔄</div><b>牌堆用完，赛道折叠！</b></div>`;
    else if(this.data) f.innerHTML='<span class="muted">准备开跑…</span>';
    const lg=$('#log'); lg.innerHTML = this.logs.length ? this.logs.map(l=>`<p>${l}</p>`).join('') : '<p class="muted">比赛记录</p>'; lg.scrollTop=lg.scrollHeight;
    $('#podium').innerHTML = [0,1,2,3].map(i=>{ const m=this.podium[i], x=m!=null?this.ms[m]:null;
      return `<div class="pd p${i+1}"><div class="e">${m!=null?EMO[m]:'　'}</div><div class="small">${m!=null?MN[m]:''}</div>${x&&x.status==='dq'?`<div class="why">出局</div>`:''}<div class="n">第 ${i+1} 名</div></div>`; }).join('');
  }
}

// ---------- 规则 ----------
function showRules(){
  $('#modal').innerHTML = `<h2>规则</h2>
  <p><b>目标：</b>一局 3 场比赛。每人起始 $10，押注吉祥物赛跑，3 场后钱最多的人获胜。</p>
  <p><b>1. 选票：</b>按蛇形顺序，每人拿 2 张票（2 人局 3 张）。每张票选<b>稳健面</b>或<b>冒险面</b>。<br>
   · 吉祥物票：所押吉祥物进前三就有钱拿；冒险面第一名赔得多，第二、三名赔得少。<br>
   · 附加赌注：猜这一场会不会发生某件事；冒险面猜对赔得多，猜错倒扣。<br>
   · 每叠票先被拿走的赔率最高。先手每场轮换。</p>
  <p><b>2. 暗中出牌：</b>每人从手牌里选 1 张（2 人局 2 张），偷偷加进比赛牌堆。牌堆共 18 张，其中一部分是公开的。</p>
  <p><b>3. 比赛：</b>先弃掉 3 张，然后逐张翻牌：<br>
   · 数字牌：前进（负数后退）；⭐ 星星：冲到面对方向最近的星星格（终点后也有一颗）。<br>
   · 摔倒：之后每张牌只能爬 1 格；已经倒下又摔倒 → 击倒出局。<br>
   · 掉头：转身往回跑，负数牌反而让它朝终点跑。恢复：站起来并转回正向，再移动。<br>
   · 转弯：走几格后换到旁边的赛道（都朝赛道中间转）；冲出赛道边缘 → 出局。<br>
   · 停在别人的格子上会把对方撞倒；全体牌所有吉祥物一起动，不会碰撞，也不能冲线。<br>
   · 跑出赛道后端 → 出局。冲线的按顺序拿名次；出局的从最后一名往前排。<br>
   · 牌堆用完：重新洗牌，赛道后端折叠到下一条白线，没越过白线的吉祥物出局。<br>
   · 3 个吉祥物冲线或出局后比赛结束。</p>
  <p><b>4. 结算：</b>按名次和附加赌注结果拿钱或扣钱，钱不够扣时扣到 0 为止。</p>
  <p><b>第三场：</b>选完票后，每人挑 1 张票双倍结算，亏的也翻倍。</p>
  <p class="muted small">赔率：吉祥物票 第1张 稳健 $6/$4/$2、冒险 $11/$1/$0；第2张 稳健 $5/$3/$2、冒险 $9/$1/$0；第3张 稳健 $4/$3/$1、冒险 $7/$1/$0。附加赌注 第1张 稳健 对+$4、冒险 对+$5 错−$3；第2张 +$3 / +$4 −$3；第3张 +$2 / +$3 −$3。</p>
  <p style="text-align:right;margin:0"><button class="main" id="closeRules">知道了</button></p>`;
  $('#mask').hidden=false; $('#closeRules').onclick=()=>$('#mask').hidden=true;
}
$('#mask').onclick = e=>{ if(e.target.id==='mask') $('#mask').hidden=true; };
document.querySelectorAll('[data-rules]').forEach(b=>b.onclick=showRules);
})();
</script>
</body>
</html>
